name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/ppmtool-react-client/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/ppmtool-react-client/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/ppmtool-react-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ppmtool-react-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Production build
        env:
          CI: 'true'
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build
