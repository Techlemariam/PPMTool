name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/ppmtool-react-client/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/ppmtool-react-client/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-lockfile:
    name: Repair lockfile on repair branch
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/react-scripts5-lockfile-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/ppmtool-react-client
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ppmtool-react-client/package-lock.json

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: synchronize frontend package lock"
          git push origin "HEAD:${{ github.head_ref }}"

  test-build:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/ppmtool-react-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/ppmtool-react-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Production build
        env:
          CI: 'true'
        run: npm run build
